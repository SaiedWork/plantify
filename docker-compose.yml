services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plantify
      POSTGRES_PASSWORD: plantify
      POSTGRES_DB: plantify
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantify"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
